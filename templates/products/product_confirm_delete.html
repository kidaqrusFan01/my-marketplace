{% extends "base.html" %}
{% block title %}Delete Product — Corazon Marketplace{% endblock %}

{% block content %}
<div class="form-box">
  <h2>Delete Product</h2>
  <p>Are you sure you want to delete "<strong>{{ product.name }}</strong>"? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger btn-block">Yes, Delete</button>
  </form>
  <p style="text-align:center; margin-top:10px;">
    <a href="{% url 'products:seller_dashboard' %}">Cancel and go back</a>
  </p>
</div>
{% endblock %}
